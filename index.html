<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libft Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap">
<style>
/* Concepto: monitor de fósforo ámbar. Una terminal central con la pregunta,
   mapa de sectores arriba e inventario de funciones dominadas a un lado. */
:root {
  --bg: #120f0a;
  --panel: #1a150d;
  --panel-2: #221b10;
  --line: #3b2f1a;
  --fg: #ffcf7a;
  --dim: #9c7c43;
  --faint: #5d4a28;
  --cyan: #7fd6c8;
  --ok: #a6e36b;
  --bad: #ff7058;
  --ink: #120f0a;
  --font-display: "VT323", "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 40px;
  background-image: repeating-linear-gradient(0deg, rgba(255, 207, 122, .035) 0 1px, transparent 1px 3px);
}
.app { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
::selection { background: var(--fg); color: var(--ink); }

/* barra de título */
.titlebar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  border: 1px solid var(--line); background: var(--panel); padding: 8px 14px;
}
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1; letter-spacing: .06em; text-shadow: 0 0 10px rgba(255, 207, 122, .45); }
.brand small { font-size: 18px; color: var(--dim); letter-spacing: .04em; margin-left: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.lives b { letter-spacing: .15em; color: var(--bad); }
.mbtn {
  background: none; border: 1px solid var(--line); color: var(--dim); padding: 0 10px; font-size: 12px; line-height: 1.7;
  text-transform: uppercase; letter-spacing: .1em; font-weight: 500;
}
.mbtn span.on { color: var(--fg); font-weight: 600; }
.mbtn:hover { border-color: var(--fg); color: var(--fg); }
.mbtn[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); }

/* mapa de sectores */
.map { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.sector {
  text-align: left; border: 1px solid var(--line); background: var(--panel); padding: 10px 10px 8px;
  display: grid; gap: 2px; align-content: start; min-width: 0;
}
.sector .hex { font-family: var(--font-display); font-size: 20px; color: var(--dim); line-height: 1; }
.sector .nm { font-weight: 600; font-size: 12px; letter-spacing: .08em; overflow-wrap: anywhere; }
.sector .pg { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.sector .bar { height: 4px; background: var(--line); margin-top: 6px; }
.sector .bar i { display: block; height: 100%; width: 0; background: var(--fg); }
.sector:hover:not(:disabled) { border-color: var(--fg); }
.sector[aria-current="true"] { border-color: var(--fg); background: var(--panel-2); box-shadow: 0 0 0 1px var(--fg) inset; }
.sector:disabled { cursor: not-allowed; opacity: .45; }
.sector.done .bar i { background: var(--ok); }
.sector.done .hex { color: var(--ok); }

/* zona principal */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
.term { border: 1px solid var(--fg); background: var(--panel); box-shadow: 0 0 24px rgba(255, 207, 122, .08); min-width: 0; }
.term-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
  background: var(--fg); color: var(--ink); padding: 4px 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
}
.term-body { padding: 18px 18px 20px; display: grid; gap: 16px; min-width: 0; }
.stars { letter-spacing: .15em; }
.tag { font-size: 12px; color: var(--cyan); letter-spacing: .06em; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .04em; }
h1 { font-size: 42px; line-height: 1; }
h2 { font-size: 28px; line-height: 1.1; }
p { margin: 0; }
.qtext { font-size: 15px; max-width: 70ch; }
.qtext code, .explain code, .hint code, .opt code { color: var(--cyan); font-family: var(--font-body); }
.prompt { color: var(--dim); }
.prompt::before { content: "> "; color: var(--fg); }

/* código */
pre.code {
  margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line);
  overflow-x: auto; font-size: 13px; line-height: 1.55; tab-size: 4; max-width: 100%;
}
pre.code .k { color: var(--cyan); }
pre.code .t { color: #f0a35e; }
pre.code .s { color: var(--ok); }
pre.code .n { color: #e6c0ff; }
pre.code .c { color: var(--faint); }
pre.code .b { color: var(--fg); background: var(--panel-2); border-bottom: 2px solid var(--fg); padding: 0 .5ch; }
.lines { display: grid; border: 1px solid var(--line); background: var(--bg); overflow-x: auto; }
.line {
  display: grid; grid-template-columns: 34px 1fr; text-align: left; background: transparent; border: 0;
  border-left: 3px solid transparent; padding: 0 10px 0 0; font-size: 13px; line-height: 1.7; white-space: pre; min-width: max-content; width: 100%;
}
.line .no { color: var(--faint); text-align: right; padding-right: 10px; user-select: none; font-variant-numeric: tabular-nums; }
.line:hover:not(:disabled) { background: var(--panel-2); }
.line.picked { border-left-color: var(--fg); background: var(--panel-2); }
.line.right { border-left-color: var(--ok); background: rgba(166, 227, 107, .12); }
.line.wrong { border-left-color: var(--bad); background: rgba(255, 112, 88, .12); }
.line:disabled { cursor: default; }

/* en táctil no hay teclado: fuera las ayudas de teclas */
@media (pointer: coarse), (max-width: 700px) {
  .actions .kbd, .kbd-inline { display: none; }
}

/* tipo build */
.bhead { margin: 14px 0 6px; color: var(--dim); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.pool { display: grid; gap: 4px; overflow-x: auto; }
.piece {
  text-align: left; background: var(--bg); border: 1px solid var(--line); padding: 2px 12px; font-size: 13px; line-height: 1.7;
  white-space: pre; min-width: max-content; width: 100%;
}
.piece:hover:not(:disabled) { border-color: var(--fg); background: var(--panel-2); }
.piece:disabled { opacity: .22; cursor: default; }
.built .empty { margin: 0; padding: 12px 14px; color: var(--faint); font-size: 13px; }

/* opciones */
.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 4px; align-items: start; text-align: left; width: 100%;
  background: var(--bg); border: 1px solid var(--line); padding: 8px 12px; min-width: 0; overflow-wrap: anywhere;
}
.opt .key { color: var(--dim); font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt.picked { border-color: var(--fg); background: var(--panel-2); }
.opt.picked .key { color: var(--fg); }
.opt.right { border-color: var(--ok); background: rgba(166, 227, 107, .12); }
.opt.wrong { border-color: var(--bad); background: rgba(255, 112, 88, .12); }
.opt.missed { border-style: dashed; border-color: var(--ok); }
.opt:disabled { cursor: default; }
.multi-note { font-size: 12px; color: var(--dim); }

.fillrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fillrow label { color: var(--dim); }
.fillrow input {
  font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 6px 10px; min-width: 0; flex: 1 1 200px; max-width: 360px;
  caret-color: var(--fg);
}
.fillrow input:disabled { border-color: var(--line); }
.fillrow input.right { border-color: var(--ok); color: var(--ok); }
.fillrow input.wrong { border-color: var(--bad); color: var(--bad); }

/* botones */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 4px 0 14px; }
.mode { border: 1px solid var(--line); background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.mode h3 { margin: 0; font-size: 22px; line-height: 1.1; color: var(--fg); }
.mode p { margin: 0; font-size: 13px; line-height: 1.5; }
.mode .meta { color: var(--dim); }
.mode .btn { align-self: flex-start; margin-top: auto; }
@media (max-width: 700px) { .modes { grid-template-columns: 1fr; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  background: transparent; border: 1px solid var(--fg); padding: 7px 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px;
}
.btn:hover:not(:disabled) { background: var(--fg); color: var(--ink); }
.btn:disabled { border-color: var(--line); color: var(--faint); cursor: not-allowed; }
.btn.ghost { border-color: var(--line); color: var(--dim); }
.btn.ghost:hover:not(:disabled) { border-color: var(--dim); background: transparent; color: var(--fg); }
.kbd { font-size: 11px; color: var(--dim); }

/* feedback */
.result { border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; background: var(--bg); }
.result.ok { border-color: var(--ok); }
.result.bad { border-color: var(--bad); }
.verdict { font-family: var(--font-display); font-size: 26px; line-height: 1; letter-spacing: .05em; }
.result.ok .verdict { color: var(--ok); }
.result.bad .verdict { color: var(--bad); }
.explain { max-width: 70ch; }
.rel { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12px; color: var(--dim); }
.chip {
  font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); color: var(--dim); background: transparent; line-height: 1.6;
}
.chip.on { border-color: var(--fg); color: var(--fg); }
.chip.link { border-color: var(--cyan); color: var(--cyan); }
.hint { color: var(--dim); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; }

/* inventario */
.inv { border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.inv-head { padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
.inv-body { padding: 12px 14px 14px; display: grid; gap: 14px; }
.inv-group { display: grid; gap: 6px; }
.inv-group h3 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fn { font-size: 12px; padding: 1px 8px; border: 1px dashed var(--faint); color: var(--faint); background: transparent; }
.fn.got { border: 1px solid var(--fg); color: var(--fg); }
.fn.sel { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.depinfo { border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--dim); min-height: 3.2em; }
.depinfo b { color: var(--fg); font-weight: 600; }

/* pantallas de texto */
.boot { font-size: 13px; color: var(--dim); display: grid; gap: 2px; }
.boot .ok { color: var(--ok); }
.final-score { font-family: var(--font-display); font-size: 64px; line-height: 1; text-shadow: 0 0 14px rgba(255, 207, 122, .5); }
.caret::after { content: "█"; animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.status-line { font-size: 12px; color: var(--dim); }
.foot { font-size: 11px; color: var(--faint); text-align: center; }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .map { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 460px) {
  body { font-size: 13px; }
  .term-body { padding: 14px 12px 16px; }
  h1 { font-size: 34px; }
  .map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .caret::after { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand">LIBFT_QUEST<small>v1.0 · by coscosgram</small></div>
    <div class="stats" aria-label="Estado">
      <span class="lives"><span data-i18n="lives">Vidas</span> <b id="st-lives">♥♥♥</b></span>
      <span>XP <b id="st-xp">0</b></span>
      <span><span data-i18n="rank">Rango</span> <b id="st-rank">PISCINERO</b></span>
      <button class="mbtn" id="modes" type="button" data-i18n="modesBtn" hidden>⌂ MODOS</button>
      <button class="mbtn" id="lang" type="button" aria-label="Idioma / Language" title="Idioma / Language">ES / EN</button>
      <button class="mbtn" id="sfx" type="button" aria-pressed="true">◆ SONIDOS: SÍ</button>
      <button class="mbtn" id="music" type="button" aria-pressed="false">♪ MÚSICA: NO</button>
    </div>
  </header>

  <nav class="map" id="map" aria-label="Sectores"></nav>

  <div class="main">
    <section class="term" id="term" aria-live="polite">
      <div class="term-head"><span id="th-left">libft@42:~$</span><span id="th-right"></span></div>
      <div class="term-body" id="screen">
        <h1>LIBFT_QUEST</h1>
        <p class="qtext">Cargando el sistema<span class="caret"></span></p>
      </div>
    </section>

    <aside class="inv" aria-label="Inventario de funciones">
      <div class="inv-head"><span data-i18n="inventory">Inventario</span><span id="inv-count">0/0</span></div>
      <div class="inv-body">
        <div id="inv-groups"></div>
        <div class="depinfo" id="depinfo">Pulsa una función para ver de cuáles depende.</div>
      </div>
    </aside>
  </div>

  <p class="foot" id="foot">Tu progreso se guarda sólo en este navegador.</p>
  <p class="foot" data-i18n="credit">Hecho por coscosgram · libft_quest.exe</p>
</div>
<script>
/* ===== Datos: sectores, dependencias y preguntas (1/2) ===== */
const SECTORS = [
  { n: 1, hex: "0x01", name: "CARACTERES", blurb: "ctype y strlen: las piezas más pequeñas." },
  { n: 2, hex: "0x02", name: "MEMORIA", blurb: "memset, memcpy y compañía: bytes, punteros y solapes." },
  { n: 3, hex: "0x03", name: "CADENAS", blurb: "Comparar, copiar y buscar dentro de strings." },
  { n: 4, hex: "0x04", name: "HEAP", blurb: "malloc entra en juego: funciones que construyen sobre otras." },
  { n: 5, hex: "0x05", name: "FD", blurb: "Escribir en descriptores de archivo." },
  { n: 6, hex: "0x06", name: "LISTAS", blurb: "Listas enlazadas: el bonus que consolida todo lo anterior." }
];

/* Qué usa cada función (las de libc van sin el prefijo ft_) */
const LIBC = ["malloc", "free", "write"];
const DEPS = {
  isalnum: ["isalpha", "isdigit"],
  bzero: ["memset"],
  memmove: ["memcpy"],
  strlcat: ["strlen", "strlcpy"],
  strnstr: ["strlen", "strncmp"],
  strdup: ["strlen", "memcpy", "malloc"],
  calloc: ["bzero", "malloc"],
  substr: ["strlen", "strlcpy", "malloc"],
  strjoin: ["strlen", "strlcpy", "strlcat", "malloc"],
  strtrim: ["strchr", "strlen", "substr"],
  split: ["substr", "malloc", "free"],
  itoa: ["malloc"],
  strmapi: ["strlen", "malloc"],
  putchar_fd: ["write"],
  putstr_fd: ["strlen", "write"],
  putendl_fd: ["putstr_fd", "putchar_fd"],
  putnbr_fd: ["putchar_fd"],
  lstnew: ["malloc"],
  lstadd_back: ["lstlast"],
  lstclear: ["lstdelone", "free"],
  lstmap: ["lstnew", "lstadd_back", "lstclear", "lstdelone"]
};

const L = (s) => s.split("\n");
const Q = [];

/* ---------- SECTOR 1 · CARACTERES ---------- */
Q.push(
  {
    id: "s1q1", s: 1, st: 1, fn: "isdigit", type: "choice",
    q: "¿Qué valores de `c` hacen que `ft_isdigit(c)` devuelva 1?",
    opts: [
      "Los códigos ASCII del 48 al 57 ('0' a '9')",
      "Los códigos ASCII del 0 al 9",
      "Los códigos ASCII del 49 al 58",
      "Cualquier valor menor que 128"
    ],
    ans: 0,
    why: "Los dígitos ASCII empiezan en '0' (48) y acaban en '9' (57). Compara con los caracteres literales y no con números mágicos: `c >= '0' && c <= '9'`. Según el subject, devuelve 1 si es dígito y 0 si no lo es. La libc real sólo garantiza «distinto de cero» (glibc devuelve 2048 en `isdigit`), pero tu libft debe seguir lo que pide el subject.",
    rel: ["isalnum"],
    hint: "El carácter '0' no vale 0, vale 48."
  },
  {
    id: "s1q2", s: 1, st: 1, fn: "toupper", type: "fill",
    q: "Completa la comparación para que sólo se conviertan las minúsculas.",
    code: `int ft_toupper(int c)
{
    if (c >= 'a' && c <= '____')
        return (c - 32);
    return (c);
}`,
    accept: ["z", "'z'"],
    why: "Las minúsculas van de 'a' (97) a 'z' (122) y la distancia a las mayúsculas es 32. Escribir `c - 'a' + 'A'` es más legible y no obliga a recordar el 32.",
    rel: ["tolower"],
    hint: "Es la última letra del alfabeto inglés."
  },
  {
    id: "s1q3", s: 1, st: 1, fn: "isalnum", type: "multi",
    q: "Un carácter es alfanumérico si es letra o dígito. ¿Qué funciones tuyas reutilizarías para escribir `ft_isalnum` en una línea?",
    opts: ["ft_isalpha", "ft_isdigit", "ft_toupper", "ft_strlen"],
    ans: [0, 1],
    why: "`return (ft_isalpha(c) || ft_isdigit(c));` Es tu primera relación entre funciones: una función nueva construida con dos que ya dominas.",
    rel: ["isalpha", "isdigit"],
    hint: "Piensa en las dos condiciones que debe cumplir el carácter."
  },
  {
    id: "s1q4", s: 1, st: 2, fn: "strlen", type: "bug",
    q: "Este `ft_strlen` devuelve basura de vez en cuando. ¿Qué línea contiene el fallo?",
    lines: L(`size_t  ft_strlen(const char *s)
{
    size_t  i;

    while (s[i])
        i++;
    return (i);
}`),
    ans: [2],
    why: "`i` no está inicializada: vale lo que hubiera en la pila. Hace falta `i = 0;` antes del bucle. La Norma no permite inicializar en la propia declaración, así que va en una línea aparte.",
    rel: [],
    hint: "Mira qué valor tiene `i` la primera vez que se evalúa `s[i]`."
  },
  {
    id: "s1q5", s: 1, st: 2, fn: "isprint", type: "choice",
    q: "¿Qué rango cumple un carácter imprimible según `ft_isprint`?",
    opts: [
      "32 a 126, con el espacio incluido",
      "33 a 126, con el espacio excluido",
      "32 a 127",
      "0 a 127"
    ],
    ans: 0,
    why: "Los imprimibles van del espacio (32) a la tilde ~ (126). El 127 es DEL, un carácter de control. El rango 0 a 127 es el de `ft_isascii`.",
    rel: ["isascii"],
    hint: "El espacio se ve como un hueco, pero sí ocupa sitio al imprimir."
  },
  {
    id: "s1q6", s: 1, st: 2, fn: "strlen", type: "choice",
    q: "¿Qué devuelve `ft_strlen(\"42\\0Madrid\")`?",
    opts: ["2", "8", "9", "Depende del compilador"],
    ans: 0,
    why: "`ft_strlen` cuenta hasta el primer carácter nulo (`\\0`), que aquí está en la posición 2. Lo que va detrás sigue en memoria, pero para C ya no forma parte de la cadena.",
    rel: [],
    hint: "¿Dónde termina una cadena de C?"
  },
  {
    id: "s1q7", s: 1, st: 3, fn: "toupper", type: "choice",
    q: "¿Por qué `ft_toupper` recibe un `int` y no un `char`?",
    opts: [
      "Para admitir `EOF` (-1) además de cualquier valor de unsigned char",
      "Porque un `char` no puede guardar letras",
      "Para que la función sea más rápida",
      "Porque la Norma lo exige"
    ],
    ans: 0,
    why: "Las funciones de `ctype.h` reciben un `int` que debe valer `EOF` o un valor representable como `unsigned char`. Así se pueden encadenar con `getc` sin perder el fin de fichero. Tu `ft_toupper` debe devolver ese `int` intacto cuando no hay conversión.",
    rel: ["tolower"],
    hint: "Piensa en el valor que devuelve `getchar` al llegar al final."
  }
);

/* ---------- SECTOR 2 · MEMORIA ---------- */
Q.push(
  {
    id: "s2q1", s: 2, st: 1, fn: "memset", type: "choice",
    q: "`ft_memset` rellena bytes. ¿Qué puntero local necesitas para escribir de byte en byte sobre un `void *s`?",
    opts: [
      "`unsigned char *`",
      "`int *`",
      "`char **`",
      "Ninguno: `s[i] = c` funciona sobre un `void *`"
    ],
    ans: 0,
    why: "Un `void *` no se puede indexar ni desreferenciar porque no tiene tamaño de elemento. Lo conviertes a `unsigned char *` para avanzar un byte cada vez. El valor `c` se interpreta además como `unsigned char`.",
    rel: ["bzero", "memcpy"],
    hint: "Necesitas un tipo que mida exactamente un byte."

function expandAlts(q) {

    if (n <= 1) return [[0]];

    perms(n - 1).forEach((p) => { for (let i = 0; i <= p.length; i++) out.push(p.slice(0, i).concat(n - 1, p.slice(i))); });

    const lo = Math.min.apply(null, group.map((b) => b[0])), hi = Math.max.apply(null, group.map((b) => b[1]));

    }));
    outs = next;

  outs.concat(q.alts || []).forEach((a) => { const k = a.join("\n"); if (!seen[k]) { seen[k] = 1; all.push(a); } });
  q.accept = all;

/* ===== Motor del juego ===== */
(function () {
  "use strict";
  const MAXLIVES = 3;
  const LS = "libft-quest-progress-v1";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

  /* ---- resaltado de C ---- */
  const KW = new Set(["return", "if", "while", "else", "for", "sizeof", "typedef", "struct"]);
  const TY = new Set(["void", "char", "int", "long", "size_t", "unsigned", "const", "t_list", "short", "double"]);
  function hl(src) {
    const re = /(\/\*[\s\S]*?\*\/)|(_{3,})|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|\b(\d+)\b|\b([A-Za-z_]\w*)\b/g;
    let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="c">' + esc(m[1]) + "</span>";
      else if (m[2]) out += '<span class="b">' + esc(m[2]) + "</span>";
      else if (m[3] || m[4]) out += '<span class="s">' + esc(m[0]) + "</span>";
      else if (m[5]) out += '<span class="n">' + m[5] + "</span>";
      else {
        const w = m[6];
        out += KW.has(w) ? '<span class="k">' + w + "</span>" : TY.has(w) ? '<span class="t">' + w + "</span>" : esc(w);
      }
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* ---- estado ---- */
  const S = {
    solved: {}, view: "start", sector: 1, queue: [], qi: 0, done: 0, total: 0, lives: MAXLIVES, review: false,
    sel: null, msel: new Set(), fill: "", checked: false, ok: null, hint: false, selFn: null, armed: false,
    mode: "normal", over: false, best: 0
  };
  Q.concat(SURV).forEach(expandAlts);
  const byId = {};

  const secQ = (n) => Q.filter((q) => q.s === n);
  const solvedCount = (n) => secQ(n).filter((q) => S.solved[q.id]).length;
  const cleared = (n) => solvedCount(n) === secQ(n).length;
  const unlocked = (n) => n === 1 || cleared(n - 1);
  const maxXP = Q.reduce((a, q) => a + q.st * 10, 0);
  const xp = () => Q.reduce((a, q) => a + (S.solved[q.id] ? q.st * 10 : 0), 0);
  const mastered = (fn) => Q.filter((q) => q.fn === fn).every((q) => S.solved[q.id]);
  const label = (n) => (LIBC.indexOf(n) >= 0 ? n : "ft_" + n);
  const stars = (n) => "★".repeat(n) + "☆".repeat(4 - n);
  const RANK_AT = [0, 0.2, 0.45, 0.75, 1];
  function rank() {

  }
  const cur = () => LQ(S.queue[S.qi]);
  const firstOpen = () => {
    for (let i = 1; i <= SECTORS.length; i++) if (!cleared(i)) return i;
    return 1;
  };

  /* ---- guardado ---- */
  let docRef = null;
  let chain = Promise.resolve();
  function mergeSolved(obj) {
    let changed = false;
    if (obj && typeof obj === "object") {
      Object.keys(obj).forEach((id) => { if (byId[id] && obj[id] && !S.solved[id]) { S.solved[id] = true; changed = true; } });
    }
    return changed;
  }
  function loadLocal() {
    try {
      const r = localStorage.getItem(LS);

    } catch (e) { /* sin almacenamiento */ }
  }

  function setFoot(mode) {

    if (docRef) {

    }
  }

  function renderChrome() { renderStats(); renderMap(); renderInv(); }

  /* la música cambia a la pista tensa durante el survival y se acelera con el avance */
  let lastTrack = "";

    const key = (tense ? "tense" : "calm") + ":" + prog.toFixed(3);

  /* ---- navegación ---- */
  function resetQ() { S.sel = null; S.msel = new Set(); S.fill = ""; S.checked = false; S.ok = null; S.hint = false; S.built = []; S.pool = null; }
  function openSector(n) { if (!unlocked(n)) return; S.mode = "normal"; S.sector = n; S.view = "sector"; S.armed = false; render(); }
  function startRun(n, review) {
    S.mode = "normal"; S.sector = n; S.review = !!review;
    S.queue = secQ(n).filter((q) => S.review || !S.solved[q.id]);
    if (!S.queue.length) { S.review = true; S.queue = secQ(n).slice(); }
    S.qi = 0; S.done = 0; S.total = S.queue.length; S.lives = MAXLIVES;
    resetQ(); S.view = "q"; render();
  }
  function startSurvival() {
    S.mode = "survival"; S.review = false; S.sector = 0; S.over = false;
    S.queue = survList(); S.qi = 0; S.done = 0; S.total = S.queue.length; S.lives = 1;
    resetQ(); S.view = "q"; render();
  }
  function next() {
    if (S.mode === "survival") {

      S.qi++;
      if (S.qi >= S.queue.length) { S.view = "survwin"; render(); return; }
      resetQ(); render(); return;
    }
    if (S.lives <= 0 && !S.review) { S.view = "segfault"; render(); return; }

  /* ---- respuestas ---- */
  const norm = (v) => String(v).replace(/\s+/g, "");

  function select(i) {
    const q = cur();

  }
  function isRight(q) {

    if (q.type === "choice") return S.sel === q.ans;
    if (q.type === "bug") return q.ans.indexOf(S.sel) >= 0;
    if (q.type === "fill") return q.accept.some((a) => norm(a) === norm(S.fill));
    if (q.type === "multi") return S.msel.size === q.ans.length && q.ans.every((i) => S.msel.has(i));

  }
  /* ---- tipo build: piezas de código ---- */
  function renderBuild() {

    if (!q || !pool || !built) return;
    const used = new Set(S.built);
    /* referencia para marcar: el orden aceptado que más líneas comparte en su sitio */
    const got = S.built.map((p) => S.pool[p]);
    let ref = q.sol, bestN = -1;
    q.accept.forEach((a) => { let n = 0; got.forEach((l, i) => { if (a[i] === l) n++; }); if (n > bestN) { bestN = n; ref = a; } });
    pool.innerHTML = S.pool.map((t, i) => '<button class="piece" data-p="' + i + '"' + (used.has(i) || S.checked ? " disabled" : "") + (used.has(i) ? ' aria-hidden="true"' : "") + ">" + (hl(t) || " ") + "</button>").join("");
    built.innerHTML = S.built.length ? S.built.map((p, k) => {

    }).join("") : '<p class="empty">' + tr("buildEmpty") + '</p>';
    pool.querySelectorAll("[data-p]").forEach((el) => el.addEventListener("click", () => { if (!S.checked) { S.built.push(+el.dataset.p); renderBuild(); const b = $("check"); if (b) b.disabled = !canCheck(); } }));

    const b = $("check"); if (b && !S.checked) b.disabled = !canCheck();

    } else if (!S.review) {

        S.armed = true; renderScreen();
        setTimeout(() => { if (S.armed && S.view === "start") { S.armed = false; renderScreen(); } }, 4000);
      } else {
        S.armed = false; S.solved = {}; save(); S.sector = 1; render();
      }
    });
  }

  function screenSector() {
    const n = S.sector, sec = LS_(SECTORS[n - 1]), t = secQ(n).length, d = solvedCount(n), done = cleared(n);
    const sts = secQ(n).map((q) => q.st), lo = Math.min.apply(null, sts), hi = Math.max.apply(null, sts);
    $("th-left").textContent = "libft@42:~/sector_" + sec.hex + "$";
    $("th-right").textContent = tr("solvedCount", d, t);
    $("screen").innerHTML =
      '<div class="tag">SECTOR ' + sec.hex + "</div><h2>" + sec.name + "</h2>" +
      '<p class="qtext">' + esc(sec.blurb) + "</p>" +
      '<div class="rel"><span>' + tr("sectorFns") + '</span>' + chipsFor(n) + "</div>" +
      '<p class="status-line">' + tr("status", t, stars(lo), stars(hi), done, t - d) + "</p>" +
      '<div class="actions">' +
      (done
        ? '<button class="btn" id="rev">' + tr("review") + '</button><button class="btn ghost" id="nxt">' + (n < SECTORS.length ? tr("nextSector") : tr("btnResult")) + "</button>"
        : '<button class="btn" id="enter">' + tr("enter") + '</button>') +
      "</div>";
    if (done) {
      $("rev").addEventListener("click", () => startRun(n, true));
      $("nxt").addEventListener("click", () => { if (n < SECTORS.length) openSector(n + 1); else { S.view = "final"; render(); } });
    } else $("enter").addEventListener("click", () => startRun(n, false));
  }


  function screenQ() {
    const q = cur(), sec = SECTORS[S.sector - 1] || { hex: "0x00" };
    $("th-left").textContent = S.mode === "survival" ? tr("survCmd") : "libft@42:~/sector_" + sec.hex + "$ ./quest" + (S.review ? tr("reviewFlag") : "");
    $("th-right").textContent = Math.min(S.done + 1, S.total) + "/" + S.total + " · " + stars(q.st);
    let body = "";
    if (q.type === "bug") {
      body = '<div class="lines" role="group" aria-label="' + tr("codeLines") + '">' +
        q.lines.map((l, i) => '<button class="line" data-i="' + i + '"><span class="no">' + (i + 1) + "</span><span>" + (hl(l) || " ") + "</span></button>").join("") + "</div>";
    } else if (q.type === "build") {
      if (!S.pool) {
        const all = q.sol.concat(q.extra || []);
        for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = all[i]; all[i] = all[j]; all[j] = t; }
        S.pool = all;
      }
      body = '<div class="bhead">' + tr("pieces") + '</div><div class="pool" id="pool"></div><div class="bhead">' + tr("yourFn") + '</div><div class="lines built" id="built"></div>';
    } else {
      if (q.code) body += '<pre class="code">' + hl(q.code) + "</pre>";
      if (q.type === "fill") {
        body += '<div class="fillrow"><label for="fill">' + tr("yourAnswer") + '</label><input id="fill" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40"></div>';
      } else {
        body += '<div class="opts">' + q.opts.map((o, i) =>
          '<button class="opt" data-i="' + i + '"><span class="key">' + (q.type === "multi" ? "[ ]" : i + 1) + "</span><span>" + fmt(o) + "</span></button>").join("") + "</div>";
      }
    }
    $("screen").innerHTML =
      '<div class="tag">' + (S.mode === "survival" ? tr("survTag") + " · " : "") + label(q.fn) + " · " + tr("types")[q.type] + "</div>" +
      '<p class="qtext">' + fmt(q.q) + "</p>" + body +
      '<div class="actions"><button class="btn" id="check" disabled>' + tr("check") + '</button><button class="btn ghost" id="hintb">' + tr("hint") + '<span class="kbd-inline"> [P]</span></button><span class="kbd">' + tr("enterToCheck") + '</span>' + '<button class="btn ghost" id="quit">' + tr("quit") + "</button>" + '</div>' +
      '<div id="hint"></div><div id="res"></div>';
    if (q.type === "build") renderBuild();
    $("screen").querySelectorAll("[data-i]").forEach((el) => el.addEventListener("click", () => select(+el.dataset.i)));
    $("check").addEventListener("click", check);
    $("quit").addEventListener("click", goModes);
    $("hintb").addEventListener("click", () => {
      S.hint = !S.hint;
      $("hint").innerHTML = S.hint ? '<p class="hint">' + fmt(q.hint) + "</p>" : "";
    });
    const inp = $("fill");
    /* al repintar (p. ej. cambio de idioma) se restaura el estado de la pregunta */
    if (S.hint) $("hint").innerHTML = '<p class="hint">' + fmt(q.hint) + "</p>";
    if (inp && S.fill) inp.value = S.fill;
    if (S.checked) { markAnswer(q); showResult(q); }
    else if (q.type === "choice" || q.type === "multi" || q.type === "bug") updateSel();
    if (inp) {
      inp.addEventListener("input", () => { S.fill = inp.value; $("check").disabled = !canCheck(); });
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } });
      if (window.matchMedia && !window.matchMedia("(max-width: 700px)").matches) inp.focus();
    }
  }

  function screenClear() {
    const n = S.sector, sec = LS_(SECTORS[n - 1]), last = n === SECTORS.length;
    $("th-left").textContent = "libft@42:~/sector_" + sec.hex + "$";
    $("th-right").textContent = tr("cleared");
    $("screen").innerHTML =
      '<div class="tag">SECTOR ' + sec.hex + "</div><h2>" + tr("sectorCleared") + "</h2>" +
      '<div class="boot"><span><span class="ok">[ OK ]</span> ' + sec.name + ": " + tr("clearQ", secQ(n).length, secQ(n).length) + "</span>" +
      '<span><span class="ok">[ OK ]</span> ' + tr("clearXp", xp(), maxXP, rank()) + "</span></div>" +
      '<div class="rel"><span>' + tr("mastered") + '</span>' + chipsFor(n) + "</div>" +
      '<div class="actions"><button class="btn" id="nxt">' + (last ? tr("viewResultArrow") : tr("nextSectorArrow")) + '</button><button class="btn ghost" id="rev">' + tr("reviewThis") + '</button></div>';
    $("nxt").addEventListener("click", () => { if (last) { S.view = "final"; render(); } else openSector(n + 1); });
    $("rev").addEventListener("click", () => startRun(n, true));
  }

  function screenSegfault() {
    const n = S.sector, sec = SECTORS[n - 1];
    $("th-left").textContent = "libft@42:~/sector_" + sec.hex + "$";
    $("th-right").textContent = "core dumped";
    $("screen").innerHTML =
      '<h1 style="color:var(--bad)">SEGMENTATION FAULT</h1>' +
      '<p class="qtext">' + tr("segP1", solvedCount(n), secQ(n).length) + "</p>" +
      '<p class="qtext">' + tr("segP2") + '</p>' +
      '<div class="actions"><button class="btn" id="retry">' + tr("retry") + '</button><button class="btn ghost" id="back">' + tr("backSector") + '</button></div>';
    $("retry").addEventListener("click", () => startRun(n, false));
    $("back").addEventListener("click", () => openSector(n));
  }

  function goModes() { S.mode = "normal"; S.armed = false; S.view = "start"; render(); }

  function screenSurvIntro() {
    $("th-left").textContent = tr("survCmd");
    $("th-right").textContent = tr("survTag");
    $("screen").innerHTML =
      '<div class="tag">' + tr("survTag") + "</div><h2>" + tr("survTitle") + "</h2>" +
      '<div class="boot">' + tr("survRules").map((r) => '<span><span class="ok">&gt;</span> ' + esc(r) + "</span>").join("") + "</div>" +
      '<p class="qtext">' + esc(tr("survBest", S.best, survList().length)) + "</p>" +
      '<div class="actions"><button class="btn" id="begin">' + tr("begin") + '</button><button class="btn ghost" id="back">' + tr("back") + "</button></div>";
    $("begin").addEventListener("click", startSurvival);
    $("back").addEventListener("click", () => { S.view = "start"; render(); });
  }

  function screenSurvOver() {
    const q = LQ(S.queue[S.qi]), tot = S.queue.length;
    $("th-left").textContent = tr("survCmd");
    $("th-right").textContent = "game over";
    $("screen").innerHTML =
      '<h1 style="color:var(--bad)">GAME OVER</h1>' +
      '<p class="qtext">' + esc(tr("survOverMsg", S.qi + 1, tot, label(q.fn))) + "</p>" +
      '<p class="qtext">' + esc(tr("survBest", S.best, tot)) + "</p>" +
      '<div class="actions"><button class="btn" id="again">' + tr("survRestart") + '</button><button class="btn ghost" id="home">' + tr("home") + "</button></div>";
    $("again").addEventListener("click", startSurvival);
    $("home").addEventListener("click", () => { S.mode = "normal"; S.view = "start"; render(); });
  }

  function screenSurvWin() {
    const tot = S.queue.length;
    $("th-left").textContent = tr("survCmd");
    $("th-right").textContent = tr("cleared");
    $("screen").innerHTML =
      '<div class="tag">' + tr("survTag") + "</div><h2>" + tr("survWinTitle") + "</h2>" +
      '<p class="qtext">' + esc(tr("survWinMsg", tot)) + "</p>" +
      '<div class="actions"><button class="btn" id="again">' + tr("survRestart") + '</button><button class="btn ghost" id="home">' + tr("home") + "</button></div>";
    $("again").addEventListener("click", startSurvival);
    $("home").addEventListener("click", () => { S.mode = "normal"; S.view = "start"; render(); });
  }

  function screenFinal() {
    $("th-left").textContent = tr("finalCmd");
    $("th-right").textContent = tr("end");
    $("screen").innerHTML =
      '<div class="tag">' + tr("resultTag") + '</div>' +
      '<div class="final-score">' + xp() + "/" + maxXP + " XP</div>" +
      "<h2>" + tr("rankIs") + rank() + "</h2>" +
      '<p class="qtext">' + (Q.every((q) => S.solved[q.id])
        ? tr("finalAll") : tr("finalSome")) + "</p>" +
      '<div class="actions"><button class="btn" id="home">' + tr("home") + '</button></div>';
    $("home").addEventListener("click", () => { S.view = "start"; render(); });
  }

  let lastView = null;
  function renderScreen() {
    if (S.view !== lastView) {
      if (window.SFX && (S.view === "clear" || S.view === "segfault" || S.view === "final" || S.view === "survover" || S.view === "survwin")) SFX.play(S.view === "survover" ? "segfault" : S.view === "survwin" ? "final" : S.view);
      lastView = S.view;
    }
    if (S.view === "start") screenStart();
    else if (S.view === "sector") screenSector();
    else if (S.view === "q") screenQ();
    else if (S.view === "clear") screenClear();
    else if (S.view === "segfault") screenSegfault();
    else if (S.view === "survintro") screenSurvIntro();
    else if (S.view === "survover") screenSurvOver();
    else if (S.view === "survwin") screenSurvWin();
    else screenFinal();
  }

  /* ---- teclado ---- */
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || S.view !== "q") return;
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT") return;
    const q = cur();
    if (e.key === "Backspace" && q.type === "build" && !S.checked) {
      e.preventDefault();
      if (S.built.length) { S.built.pop(); renderBuild(); }
    } else if (e.key === "Enter") {
      if (tag === "BUTTON") return;
      e.preventDefault();
      if (!S.checked) check(); else next();
    } else if (/^[1-9]$/.test(e.key) && (q.type === "choice" || q.type === "multi")) {
      if (+e.key <= q.opts.length) select(+e.key - 1);
    } else if (e.key === "p" || e.key === "P") {
      const hb = $("hintb");
      if (hb && !hb.disabled) hb.click();
    }
  });

  /* ---- arranque ---- */
  $("modes").addEventListener("click", goModes);
  const lb = $("lang");
  if (lb) lb.addEventListener("click", () => {
    LANG = LANG === "es" ? "en" : "es";
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) { /* sin almacenamiento */ }
    applyStatic();
    render();
    document.dispatchEvent(new Event("langchange"));
  });
  loadLocal();
  applyStatic();
  render();
  initStore();
})();

/* ===== Música chiptune (Web Audio, composición original) ===== */
(function () {
  "use strict";
  const btn = document.getElementById("music");
  if (!btn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { btn.hidden = true; return; }

  const KEY = "libft-quest-music";
  const STEPS = 128, TSTEPS = 64;
  let tempo = 118, track = "calm";
  const stepLen = () => 60 / tempo / 4;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* acordes: [nota de bajo, tres notas del acorde] en números MIDI */
  const CH = {
    Am: [45, [57, 60, 64]], F: [41, [53, 57, 60]], C: [48, [60, 64, 67]],
    G: [43, [55, 59, 62]], E: [40, [52, 56, 59]]
  };
  const PROG = ["Am", "F", "C", "G", "Am", "F", "G", "Am"];

  /* melodía: por compás, [paso 0-15, nota MIDI, duración en pasos] */
  const LEAD = [
    [[0, 76, 3], [3, 72, 1], [4, 74, 2], [6, 72, 2], [8, 69, 4], [12, 72, 2], [14, 74, 2]],
    [[0, 77, 3], [3, 74, 1], [4, 72, 2], [6, 74, 2], [8, 77, 4], [12, 76, 2], [14, 74, 2]],
    [[0, 76, 2], [2, 79, 2], [4, 76, 2], [6, 72, 2], [8, 74, 4], [12, 72, 2], [14, 67, 2]],
    [[0, 71, 3], [3, 74, 1], [4, 79, 4], [8, 74, 2], [10, 71, 2], [12, 74, 4]],
    [[0, 81, 3], [3, 79, 1], [4, 76, 2], [6, 72, 2], [8, 76, 4], [12, 79, 2], [14, 76, 2]],
    [[0, 77, 3], [3, 81, 1], [4, 77, 2], [6, 74, 2], [8, 72, 4], [12, 74, 2], [14, 77, 2]],
    [[0, 79, 2], [2, 74, 2], [4, 71, 2], [6, 74, 2], [8, 79, 4], [12, 77, 2], [14, 76, 2]],
    [[0, 76, 4], [4, 72, 4], [8, 71, 2], [10, 68, 2], [12, 69, 4]]
  ];

  let ctx = null, master = null, noiseBuf = null, timer = null, nextTime = 0, step = 0, on = false, resumeAfterHidden = false;

  function tone(type, freq, t, dur, gain) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, gain, hp) {
    const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.16);
  }

  /* pista tensa del survival: pulso grave, latido, alarma aguda y subida cromática */
  const TL = [
    [[0, 76, 1], [1, 75, 1], [2, 76, 1], [3, 75, 1], [4, 76, 2], [6, 71, 2], [8, 72, 1], [9, 71, 1], [10, 72, 1], [11, 71, 1], [12, 72, 2], [14, 67, 2]],
    [[0, 76, 1], [1, 75, 1], [2, 76, 1], [3, 75, 1], [4, 76, 2], [6, 71, 2], [8, 72, 1], [9, 71, 1], [10, 72, 1], [11, 71, 1], [12, 77, 2], [14, 76, 2]],
    [[0, 77, 1], [1, 76, 1], [2, 77, 1], [3, 76, 1], [4, 77, 2], [6, 72, 2], [8, 73, 1], [9, 72, 1], [10, 73, 1], [11, 72, 1], [12, 73, 2], [14, 68, 2]],
    []
  ];
  for (let k = 0; k < 16; k++) TL[3].push([k, 64 + k, 1]);
  function playTense(i, t) {
    const STEP = stepLen();
    const bar = Math.floor(i / 16), s = i % 16;
    const root = bar === 2 ? 41 : 40;
    if (s % 2 === 0) tone("sawtooth", mtof(root + (s % 8 === 6 ? 12 : 0)), t, STEP * 1.5, 0.15);
    if (s === 0 || s === 3 || s === 8 || s === 11) kick(t);
    if (s === 4 || s === 12) noise(t, 0.1, 0.13, 1200);
    noise(t, 0.03, s % 2 ? 0.055 : 0.03, 7000);
    TL[bar].forEach((n) => { if (n[0] === s) tone("square", mtof(n[1]), t, STEP * n[2] * 0.9, 0.07); });
    if (bar < 3 ? (s === 0 || s === 8) : s % 2 === 0) tone("square", mtof(88), t, STEP * 0.45, 0.035);
  }

  function playStep(i, t) {
    if (track === "tense") { playTense(i, t); return; }
    const STEP = stepLen();
    const bar = Math.floor(i / 16), s = i % 16;
    const name = bar === 7 && s >= 8 ? "E" : PROG[bar];
    const root = CH[name][0], tones = CH[name][1];
    if (s % 2 === 0) tone("triangle", mtof(root + (s % 4 === 2 ? 12 : 0)), t, STEP * 1.8, 0.32);
    tone("square", mtof(tones[[0, 1, 2, 1][s % 4]] + 12), t, STEP * 0.9, 0.035);
    LEAD[bar].forEach((n) => { if (n[0] === s) tone("square", mtof(n[1]), t, STEP * n[2] * 0.95, 0.07); });
    if (s === 0 || s === 8) kick(t);
    if (s === 4 || s === 12) noise(t, 0.12, 0.12, 1500);
    if (s % 4 === 2) noise(t, 0.04, 0.05, 6000);
  }

  function tick() {
    while (nextTime < ctx.currentTime + 0.25) {
      playStep(step, nextTime);
      nextTime += stepLen();
      step = (step + 1) % (track === "tense" ? TSTEPS : STEPS);
    }
  }

  function paint() {
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = tr("music", on);
  }
  function remember(v) { try { localStorage.setItem(KEY, v ? "on" : "off"); } catch (e) { /* sin almacenamiento */ } }

  function start() {
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.6;
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (ctx.state === "suspended") ctx.resume();
      step = 0;
      nextTime = ctx.currentTime + 0.08;
      tick();
      timer = setInterval(tick, 50);
      on = true;
    } catch (e) { on = false; ctx = null; }
    paint();
  }
  function stop() {
    clearInterval(timer);
    timer = null;
    if (ctx) { try { ctx.close(); } catch (e) { /* ya cerrado */ } }
    ctx = null; on = false;
    paint();
  }

  /* si la música estaba activada la última vez, arranca en el primer gesto */
  function arm(e) {
    if (btn.contains(e.target)) return;
    if (e.type === "keydown" && !(e.key === "Enter" || e.key === " " || /^[1-9a-zA-Z]$/.test(e.key))) return;
    disarm();
    if (!on) { start(); }
  }
  function disarm() {
    document.removeEventListener("pointerdown", arm, true);
    document.removeEventListener("keydown", arm, true);
  }

  btn.addEventListener("click", () => {
    disarm();
    if (on) { stop(); remember(false); } else { start(); remember(true); }
  });

  /* en pestaña oculta se calla; al volver, continúa */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && on) { resumeAfterHidden = true; stop(); }
    else if (!document.hidden && resumeAfterHidden) { resumeAfterHidden = false; start(); }
  });

  /* el motor avisa del cambio de pista; la tensa va más rápido según el avance */
  document.addEventListener("trackchange", (e) => {
    const d = e.detail || {};
    const changed = d.track !== track;
    track = d.track === "tense" ? "tense" : "calm";
    tempo = track === "tense" ? 148 + 52 * (d.progress || 0) : 118;
    if (changed) {
      step = 0;
      if (ctx) nextTime = ctx.currentTime + 0.05;
    }
  });
  document.addEventListener("langchange", paint);
  paint();
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* sin almacenamiento */ }
  if (saved === "on") {
    document.addEventListener("pointerdown", arm, true);
    document.addEventListener("keydown", arm, true);
  }
})();

/* ===== Efectos de sonido retro (Web Audio, 8 bits) ===== */
(function () {
  "use strict";
  const AC = window.AudioContext || window.webkitAudioContext;
  const KEY = "libft-quest-sfx";
  const btn = document.getElementById("sfx");
  let ctx = null, out = null, nb = null, enabled = true;
  try { if (localStorage.getItem(KEY) === "off") enabled = false; } catch (e) { /* sin almacenamiento */ }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function paint() {
    if (!btn) return;
    btn.setAttribute("aria-pressed", enabled ? "true" : "false");
    btn.textContent = tr("sfx", enabled);
  }
  function ensure() {
    if (!AC) return false;
    if (!ctx) {
      try {
        ctx = new AC();
        out = ctx.createGain(); out.gain.value = 0.5; out.connect(ctx.destination);
        nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
        const d = nb.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; return false; }
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }
  /* f0 -> f1 en dur segundos, empezando en t0 */
  function beep(type, f0, f1, t0, dur, gain) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(out);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function hiss(t0, dur, gain, hp) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nb; f.type = "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }
  function seq(type, notes, t0, step, len, gain) {
    notes.forEach((m, i) => beep(type, mtof(m), mtof(m), t0 + i * step, len, gain));
  }

  const FX = {
    click(t) { beep("square", 1100, 1500, t, 0.035, 0.09); },
    key(t) { beep("square", 700, 700, t, 0.025, 0.07); },
    ok(t) { seq("square", [72, 76, 79, 84], t, 0.075, 0.12, 0.12); },
    bad(t) { beep("sawtooth", 200, 70, t, 0.32, 0.14); hiss(t, 0.12, 0.08, 800); },
    clear(t) {
      seq("square", [67, 72, 76, 79, 76, 79, 84], t, 0.11, 0.16, 0.11);
      seq("triangle", [48, 48, 52, 55, 52, 55, 60], t, 0.11, 0.2, 0.25);
    },
    segfault(t) {
      hiss(t, 0.7, 0.2, 300);
      beep("sawtooth", 330, 40, t, 0.8, 0.14);
      beep("square", 110, 30, t + 0.1, 0.7, 0.1);
    },
    final(t) {
      seq("square", [60, 64, 67, 72, 67, 72, 76, 79, 76, 84], t, 0.12, 0.2, 0.1);
      seq("triangle", [36, 36, 43, 48, 43, 48, 52, 55, 52, 60], t, 0.12, 0.25, 0.28);
    }
  };

  function play(name) {
    if (!enabled || !FX[name] || !ensure()) return;
    try { FX[name](ctx.currentTime + 0.01); } catch (e) { /* audio no disponible */ }
  }
  window.SFX = { play };

  /* clic en cualquier botón o elemento interactivo */
  document.addEventListener("click", (e) => {
    const el = e.target.closest && e.target.closest("button, [data-i], .sector, a, [role=button]");
    if (!el || el.disabled) return;
    if (el.id === "sfx") return;
    play("click");
  }, true);

  if (btn) {
    if (!AC) btn.hidden = true;
    btn.addEventListener("click", () => {
      enabled = !enabled;
      try { localStorage.setItem(KEY, enabled ? "on" : "off"); } catch (e) { /* sin almacenamiento */ }
      paint();
      if (enabled) play("ok");
    });
    document.addEventListener("langchange", paint);
    paint();
  }
})();
</script>
</body></html>
